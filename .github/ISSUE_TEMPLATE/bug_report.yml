name: Bug report
description: Report a reproducible problem in HouseLedger
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include financial records, personal notes, database files, or other sensitive data in this report.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Check the version shown in the application or the downloaded release name.
      placeholder: "1.3.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Android
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of actions that consistently triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact user-facing error message, if any.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted logs or error details. Remove personal and financial data first.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include screenshots, whether the issue is reproducible, and any recent changes.