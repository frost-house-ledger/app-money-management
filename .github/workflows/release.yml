name: Release

on:
  push:
    branches:
      - "main"
permissions:
  contents: write

jobs:
  release-windows:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is empty"
          }

          $message = git log -1 --format=%B
          if ($message -notmatch '(?m)^release:\s*v?([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)\s*$') {
            throw "Release commit message must start with 'release:' followed by a semantic version."
          }
          if ($Matches[1] -ne $version) {
            throw "Commit version $($Matches[1]) does not match package.json version $version."
          }

          $tag = "v$($Matches[1])"

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Cache electron-builder
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron
            ~/AppData/Local/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-


      - name: Build React (vite)
        run: npm run react:build

      - name: Build Windows installer (x64)
        run: npx electron-builder --publish never --win nsis --x64

      # Electron 44 no longer publishes ia32 headers. Use the last Electron
      # line that still provides them for the legacy x86 installer.
      - name: Install Electron for x86 build
        run: npm install --no-save --package-lock=false --ignore-scripts electron@31.7.7

      - name: Rebuild native dependencies for x86
        run: npx electron-builder install-app-deps --arch ia32

      - name: Build Windows installer (x86)
        run: npx electron-builder --publish never --win nsis --ia32

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG

          # ===============================================
          # Standardized output names for artifacts (ensure electron-builder uses these names)

          $x64Pattern  = "release\\HouseLedger-$tag-x64.exe"
          $x86Pattern  = "release\\HouseLedger-$tag-ia32.exe"

          Write-Host "Searching for artifacts using patterns:" $x64Pattern $x86Pattern

          function Find-Installer($pattern, $fallback) {
            $file = Get-Item $pattern -ErrorAction SilentlyContinue
            if (-not $file) { $file = Get-Item $fallback -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $file) { throw "Installer not found: $pattern (fallback: $fallback)" }
            return $file
          }

          $x64  = Find-Installer $x64Pattern  "release\\HouseLedger-*-x64.exe"
          $x86  = Find-Installer $x86Pattern  "release\\HouseLedger-*-ia32.exe"


          # ===============================================
          # Copy artifact copies with deterministic names to Actions artifacts (for CI consumers)
          mkdir -Force artifacts
          Copy-Item $x64.FullName -Destination "artifacts\\HouseLedger-$($tag)-x64.exe" -Force
          Copy-Item $x86.FullName -Destination "artifacts\\HouseLedger-$($tag)-x86.exe" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: artifacts/*.exe

      - name: Create release tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (git show-ref --tags --verify --quiet "refs/tags/$tag") {
            throw "Release tag already exists: $tag"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $tag --message "Release $tag" $env:GITHUB_SHA
          git push origin "refs/tags/$tag:refs/tags/$tag"

      # Now create or replace the GitHub Release (after artifacts uploaded)
      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          gh release delete $tag -y --cleanup-tag || true
          gh release create $tag --target $env:GITHUB_SHA --title "HouseLedger $tag" --generate-notes $PWD\artifacts\HouseLedger-$($tag)-x64.exe $PWD\artifacts\HouseLedger-$($tag)-x86.exe

      # Rollback step: if anything after this fails, delete the created release and fail early
      - name: Rollback on failure
        if: failure() && steps.create_release.outcome == 'success'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          Write-Host "Release failed — attempting rollback for $tag"
          gh release delete $tag -y || Write-Host "Rollback: release $tag not present or already deleted"
          # optionally remove uploaded artifacts directory
          Remove-Item -Recurse -Force artifacts -ErrorAction SilentlyContinue || Write-Host "No artifacts to remove"

      # Debug helpers (commented): uncomment for troubleshooting within CI run
      #- name: Debug - list release dir
      #  shell: pwsh
      #  run: |
      #    Write-Host "Contents of release dir:"; Get-ChildItem -Path release -File -Recurse | Format-Table
      #    Write-Host "Contents of artifacts dir:"; Get-ChildItem -Path artifacts -File -Recurse | Format-Table
