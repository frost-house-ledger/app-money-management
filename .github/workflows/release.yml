name: Release

on:
  push:
    branches:
      - "main"
permissions:
  contents: write

jobs:
  release-windows:
    # "release is required in the commit message to trigger this workflow"
    if: startsWith(github.event.head_commit.message, 'release')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is empty"
          }

          # The commit message is the release trigger; package.json is the version source.
          if ($version -notmatch '^(\d+)\.(\d+)') {
            throw "package.json version must start with major.minor: $version"
          }

          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $tag = "v$major.$minor"
          while (git show-ref --tags --verify --quiet "refs/tags/$tag") {
            if ($minor -eq 9) {
              $major++
              $minor = 0
            } else {
              $minor++
            }
            $tag = "v$major.$minor"
          }

          $packageVersion = "$major.$minor.0"
          if ($version -ne $packageVersion) {
            npm version $packageVersion --no-git-tag-version --allow-same-version
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Synchronize Tauri version from package.json
        run: npm run sync:tauri-version

      - name: Install Rust Windows x86 target
        run: rustup target add i686-pc-windows-msvc

      - name: Run tests
        run: npm test

      - name: Build Windows installers
        run: npm run dist:win:all

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG

          # ===============================================
          $x64Pattern = "src-tauri\\target\\release\\bundle\\nsis\\HouseLedger_*_x64-setup.exe"
          $x86Pattern = "src-tauri\\target\\i686-pc-windows-msvc\\release\\bundle\\nsis\\HouseLedger_*_x86-setup.exe"

          Write-Host "Searching for artifact:" $x64Pattern
          Write-Host "Searching for artifact:" $x86Pattern

          function Find-Installer($pattern, $fallback) {
            $file = Get-Item $pattern -ErrorAction SilentlyContinue
            if (-not $file) { $file = Get-Item $fallback -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $file) { throw "Installer not found: $pattern (fallback: $fallback)" }
            return $file
          }

          $x64 = Find-Installer $x64Pattern "src-tauri\\target\\release\\bundle\\nsis\\*.exe"
          $x86 = Find-Installer $x86Pattern "src-tauri\\target\\i686-pc-windows-msvc\\release\\bundle\\nsis\\*.exe"


          # ===============================================
          # Copy artifact copies with deterministic names to Actions artifacts (for CI consumers)
          mkdir -Force artifacts
          Copy-Item $x64.FullName -Destination "artifacts\\HouseLedger-$($tag)-x64.exe" -Force
          Copy-Item $x86.FullName -Destination "artifacts\\HouseLedger-$($tag)-x86.exe" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: artifacts/*.exe

      - name: Create release tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (git show-ref --tags --verify --quiet "refs/tags/$tag") {
            throw "Release tag already exists: $tag"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $tag --message "Release $tag" $env:GITHUB_SHA
          git push origin "refs/tags/${tag}:refs/tags/${tag}"

      # Now create or replace the GitHub Release (after artifacts uploaded)
      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          gh release delete $tag -y --cleanup-tag || true
          gh release create $tag --target $env:GITHUB_SHA --title "HouseLedger $tag" --generate-notes $PWD\artifacts\HouseLedger-$($tag)-x64.exe $PWD\artifacts\HouseLedger-$($tag)-x86.exe

      # Rollback step: if anything after this fails, delete the created release and fail early
      - name: Rollback on failure
        if: failure() && steps.create_release.outcome == 'success'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          Write-Host "Release failed — attempting rollback for $tag"
          gh release delete $tag -y || Write-Host "Rollback: release $tag not present or already deleted"
          # optionally remove uploaded artifacts directory
          Remove-Item -Recurse -Force artifacts -ErrorAction SilentlyContinue || Write-Host "No artifacts to remove"

      # Debug helpers (commented): uncomment for troubleshooting within CI run
      #- name: Debug - list release dir
      #  shell: pwsh
      #  run: |
      #    Write-Host "Contents of release dir:"; Get-ChildItem -Path release -File -Recurse | Format-Table
      #    Write-Host "Contents of artifacts dir:"; Get-ChildItem -Path artifacts -File -Recurse | Format-Table
